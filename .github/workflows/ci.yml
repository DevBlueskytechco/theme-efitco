name: CI
on:
  push:
    branches: [develop]   # nhánh feature chạy qua pull_request, tránh chạy 2 lần
  pull_request:
  workflow_dispatch:   # chạy đủ store-tests trên develop dù công tắc đang tắt: gh workflow run CI --ref develop
jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Dùng CLI 4 giống máy CTO và agent; theme-check-action@v2 kéo bản cũ báo lỗi giả string[] (ES1-T10)
      # Ghim chính xác 4.9.5, nguồn duy nhất: PINNED_CLI trong scripts/shopify-cli.sh (ES1-T32). Nâng 5.x khi job cli5-canary xanh ổn định.
      - run: npm i -g "@shopify/cli@$(scripts/shopify-cli.sh pinned)"
      - name: Test parser JSON CLI 4.9.5 + 5.0
        run: bash scripts/shopify-cli.test.sh
      - name: Test preview-push với shopify giả (ES1-T162)
        run: bash scripts/preview-push.test.sh
      # Logic trần JS (ES1-T177): chạy được không cần npm ci, phần trình duyệt chạy ở job lighthouse.
      - name: Test logic ngân sách JS
        run: node scripts/js-budget.test.mjs
      # CTO 11/11 (ES1-T310 #1): base.css nạp chặn render mọi trang, gzip ≤ 49 152 B. Không cần store nên chạy cả khi RUN_STORE_TESTS tắt.
      - name: base.css gzip ≤ 49 152 B
        run: |
          S=$(gzip -c assets/base.css | wc -c | tr -d ' ')
          echo "assets/base.css gzip: $S / 49152 B"
          [ "$S" -le 49152 ] || { echo "::error file=assets/base.css::gzip $S B > 49 152 B (ES1-T310 #1): xoá CSS cũ của phần thay thế, xem docs/runbook.md mục 12"; exit 1; }
      # Runner có sẵn shellcheck. Chỉ báo, không chặn: script cũ chưa từng chạy shellcheck (ES1-T162).
      - name: shellcheck scripts
        continue-on-error: true
        run: shellcheck scripts/*.sh
      - run: scripts/shopify-cli.sh assert-version
      - name: theme check (JSON → annotation, dòng/cột từ 1)
        run: |
          rc=0
          shopify theme check --output json --fail-level error > "$RUNNER_TEMP/check.json" || rc=$?
          scripts/shopify-cli.sh check-report "$RUNNER_TEMP/check.json" || rc=1
          exit $rc
  preview:
    needs: theme-check
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.push.outputs.url }}
      theme_id: ${{ steps.push.outputs.theme_id }}
    env:
      SHOPIFY_FLAG_STORE: hoa-qua-nhap-khau.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g "@shopify/cli@$(scripts/shopify-cli.sh pinned)" && scripts/shopify-cli.sh assert-version
      # Chỉ cảnh báo, không chặn PR khác (ES1-T162). Chạy trước push để vẫn thấy khi push của nhánh trùng tên bị dừng.
      - name: Cảnh báo live theme tên ai-*
        continue-on-error: true
        run: |
          shopify theme list --json > "$RUNNER_TEMP/theme-list.json"
          scripts/shopify-cli.sh live-theme-warn "$RUNNER_TEMP/theme-list.json"
      # Dùng lại theme ai-<nhánh>; list {themes:[...]}/mảng, id chuỗi/số/gid; push partial + issues[] = lỗi (ES1-T32)
      - id: push
        run: scripts/preview-push.sh
  # Thử CLI 5.x: không chặn merge (continue-on-error). Chạy sau lighthouse/e2e để không đẩy đè theme khi đang đo.
  # Xanh ổn định nhiều PR liên tiếp → mở ticket nâng PINNED_CLI. Không đặt job này làm required check.
  cli5-canary:
    needs: [preview, lighthouse, e2e]
    if: always() && needs.preview.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SHOPIFY_FLAG_STORE: hoa-qua-nhap-khau.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @shopify/cli@5 && shopify version
      - name: theme check (CLI 5)
        run: |
          rc=0
          shopify theme check --output json --fail-level error > "$RUNNER_TEMP/check.json" || rc=$?
          scripts/shopify-cli.sh check-report "$RUNNER_TEMP/check.json" || rc=1
          exit $rc
      - name: preview (CLI 5, cùng theme ai-<nhánh>)
        id: push
        run: scripts/preview-push.sh
      - name: So theme id với job preview 4.9.5
        env:
          WANT: ${{ needs.preview.outputs.theme_id }}
          GOT: ${{ steps.push.outputs.theme_id }}
        run: |
          [ "$WANT" = "$GOT" ] || { echo "::error::CLI 5 đọc theme id $GOT, 4.9.5 là $WANT"; exit 1; }
          echo "CLI 5 preview OK: theme_id=$GOT"
  # Mỗi lần 1 PR dùng store: e2e + lhci song song của nhiều PR gây 429 và trang bot protection (ES1-T162).
  # theme-check, preview vẫn song song. Group giữ 1 chạy + 1 chờ: run thứ 3 vào hàng thì run đang chờ bị huỷ,
  # check lighthouse, e2e của run đó đỏ và phải chạy lại (docs/runbook.md mục 9).
  # CTO 06/11: đợt trang chủ tắt e2e + lighthouse để tăng tốc: vars.RUN_STORE_TESTS = false. Bật lại: gh variable delete RUN_STORE_TESTS.
  store-tests:
    needs: preview
    if: github.event_name == 'workflow_dispatch' || vars.RUN_STORE_TESTS != 'false'
    concurrency: { group: store-hoa-qua-e2e, cancel-in-progress: false }
    uses: ./.github/workflows/store-tests.yml
    with:
      theme_id: ${{ needs.preview.outputs.theme_id }}
    secrets:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
  # Check bắt buộc tên "lighthouse", "e2e" (merge_pr.sh, dashboard): đỏ cả khi store-tests bị huỷ hoặc không chạy
  lighthouse:
    needs: store-tests
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULT: ${{ needs.store-tests.outputs.lighthouse_result }}
      GROUP_RESULT: ${{ needs.store-tests.result }}
      STORE_TESTS: ${{ vars.RUN_STORE_TESTS }}
      EVENT: ${{ github.event_name }}
    steps:
      - run: |
          if [ "$GROUP_RESULT" = "skipped" ] && [ "$STORE_TESTS" = "false" ] && [ "$EVENT" != "workflow_dispatch" ]; then echo "::warning::CHƯA CHẠY lighthouse: công tắc RUN_STORE_TESTS tắt (CTO 06/11). Check này pass KHÔNG có nghĩa đã kiểm."; exit 0; fi
          [ "$RESULT" = "success" ] || { echo "::error::lighthouse: ${RESULT:-không chạy} (store-tests: $GROUP_RESULT)"; exit 1; }
  e2e:
    needs: store-tests
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULT: ${{ needs.store-tests.outputs.e2e_result }}
      GROUP_RESULT: ${{ needs.store-tests.result }}
      STORE_TESTS: ${{ vars.RUN_STORE_TESTS }}
      EVENT: ${{ github.event_name }}
    steps:
      - run: |
          if [ "$GROUP_RESULT" = "skipped" ] && [ "$STORE_TESTS" = "false" ] && [ "$EVENT" != "workflow_dispatch" ]; then echo "::warning::CHƯA CHẠY e2e: công tắc RUN_STORE_TESTS tắt (CTO 06/11). Check này pass KHÔNG có nghĩa đã kiểm."; exit 0; fi
          [ "$RESULT" = "success" ] || { echo "::error::e2e desktop/mobile: ${RESULT:-không chạy} (store-tests: $GROUP_RESULT)"; exit 1; }
