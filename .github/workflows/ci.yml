name: CI
on:
  push:
    branches: [develop]   # nhánh feature chạy qua pull_request, tránh chạy 2 lần
  pull_request:
jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Dùng CLI 4 giống máy CTO và agent; theme-check-action@v2 kéo bản cũ báo lỗi giả string[] (ES1-T10)
      - run: npm i -g @shopify/cli@4
      - run: shopify version && shopify theme check --fail-level error
  preview:
    needs: theme-check
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.push.outputs.url }}
      theme_id: ${{ steps.push.outputs.theme_id }}
    env:
      SHOPIFY_FLAG_STORE: hoa-qua-nhap-khau.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @shopify/cli@4   # ghim major 4 (máy CTO + agent dùng 4.x; 3.x báo lỗi giả string[] — ES1-T10)
      - id: push
        run: |
          # Nhánh PR dùng GITHUB_HEAD_REF (GITHUB_REF_NAME của PR là "15/merge")
          B="ai-$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-' | cut -c1-40)"
          # Dùng lại theme preview cùng tên nếu đã có, tránh đầy giới hạn 20 theme của store
          find_id() {
            shopify theme list --json > list.json || return 1
            jq -r --arg n "$B" '(if type=="array" then . else (.themes // .data // []) end) | map(select(.name==$n)) | .[0].id // empty' list.json
          }
          # Shopify đôi khi trả 502 khi tạo theme: thử 3 lần, mỗi lần kiểm lại theme đã được tạo chưa
          for i in 1 2 3; do
            ID=$(find_id || true)
            if [ -n "$ID" ]; then ARGS=(--theme "$ID"); else ARGS=(--unpublished --theme "$B"); fi
            if shopify theme push "${ARGS[@]}" --json --path . > push.json 2> push.err; then break; fi
            echo "::warning::theme push lần $i lỗi"; cat push.json push.err
            [ "$i" = 3 ] && { echo "::error::theme push lỗi sau 3 lần"; exit 1; }
            sleep $((i * 20))
          done
          cat push.json
          # id có thể là số hoặc gid://shopify/OnlineStoreTheme/123 → chỉ lấy số
          TID=$(jq -r '(.theme // .) | .id' push.json | sed 's#.*/##')
          [ -z "$TID" ] || [ "$TID" = "null" ] && TID=$(find_id | sed 's#.*/##')
          echo "theme_id=$TID"; [[ "$TID" =~ ^[0-9]+$ ]] || { echo "::error::không lấy được theme id"; exit 1; }
          echo "theme_id=$TID" >> "$GITHUB_OUTPUT"
          echo "url=https://hoa-qua-nhap-khau.myshopify.com/?preview_theme_id=$TID" >> "$GITHUB_OUTPUT"
  lighthouse:
    needs: preview
    runs-on: ubuntu-latest
    env:
      STORE_ORIGIN: https://hoa-qua-nhap-khau.myshopify.com
      THEME_ID: ${{ needs.preview.outputs.theme_id }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      BENCH_PRODUCT: ${{ vars.BENCH_PRODUCT }}
      BENCH_COLLECTION: ${{ vars.BENCH_COLLECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Lighthouse desktop + mobile
        run: |
          Q="preview_theme_id=${THEME_ID}&pb=0"
          URLS=(--collect.url="${STORE_ORIGIN}/?${Q}")
          [ -n "$BENCH_PRODUCT" ] && URLS+=(--collect.url="${STORE_ORIGIN}/products/${BENCH_PRODUCT}?${Q}")
          [ -n "$BENCH_COLLECTION" ] && URLS+=(--collect.url="${STORE_ORIGIN}/collections/${BENCH_COLLECTION}?${Q}")
          FAIL=0
          npx lhci autorun --config=lighthouserc.json "${URLS[@]}" || FAIL=1
          mkdir -p lh-out && cp .lighthouseci/lhr-*.json lh-out/ 2>/dev/null || true
          npx lhci autorun --config=lighthouserc.mobile.json "${URLS[@]}" || FAIL=1
          cp .lighthouseci/lhr-*.json lh-out/ 2>/dev/null || true
          exit $FAIL
      - name: Bảng điểm
        if: always()
        run: |
          # Đọc thẳng lhr-*.json: có cả khi assert fail (manifest chỉ có sau upload)
          shopt -s nullglob
          for f in lh-out/lhr-*.json; do
            jq -r '"\(.configSettings.formFactor)  \(.finalDisplayedUrl | split("?")[0])  status=\(.runtimeError.code // "ok")  perf=\(.categories.performance.score)  a11y=\(.categories.accessibility.score)  bp=\(.categories["best-practices"].score)  seo=\(.categories.seo.score)"' "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: lh-out, if-no-files-found: ignore }
  e2e:
    needs: preview
    runs-on: ubuntu-latest
    env:
      STORE_ORIGIN: https://hoa-qua-nhap-khau.myshopify.com
      PREVIEW_URL: https://hoa-qua-nhap-khau.myshopify.com/?preview_theme_id=${{ needs.preview.outputs.theme_id }}&pb=0
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, if-no-files-found: ignore }
