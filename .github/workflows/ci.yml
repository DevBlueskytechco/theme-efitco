name: CI
on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shopify/theme-check-action@v2
        with: { token: "${{ github.token }}" }
  preview:
    needs: theme-check
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.push.outputs.url }}
      theme_id: ${{ steps.push.outputs.theme_id }}
    env:
      SHOPIFY_FLAG_STORE: efitco-ai-dev.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @shopify/cli@latest
      - id: push
        run: |
          B=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          OUT=$(shopify theme push --unpublished --json --theme "ai-$B" --path .)
          echo "url=$(echo "$OUT" | jq -r .theme.preview_url)" >> $GITHUB_OUTPUT
          echo "theme_id=$(echo "$OUT" | jq -r .theme.id)" >> $GITHUB_OUTPUT
  lighthouse:
    needs: preview
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
      BENCH_PRODUCT: ${{ vars.BENCH_PRODUCT }}
      BENCH_COLLECTION: ${{ vars.BENCH_COLLECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @lhci/cli
      - run: lhci autorun --config=lighthouserc.json
      - run: lhci autorun --config=lighthouserc.mobile.json
  e2e:
    needs: preview
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report }
