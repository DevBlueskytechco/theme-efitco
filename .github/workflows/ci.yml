name: CI
on:
  push:
    branches: [develop]   # nhánh feature chạy qua pull_request, tránh chạy 2 lần
  pull_request:
jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Dùng CLI 4 giống máy CTO và agent; theme-check-action@v2 kéo bản cũ báo lỗi giả string[] (ES1-T10)
      # Ghim chính xác 4.9.5, nguồn duy nhất: PINNED_CLI trong scripts/shopify-cli.sh (ES1-T32). Nâng 5.x khi job cli5-canary xanh ổn định.
      - run: npm i -g "@shopify/cli@$(scripts/shopify-cli.sh pinned)"
      - name: Test parser JSON CLI 4.9.5 + 5.0
        run: bash scripts/shopify-cli.test.sh
      - run: scripts/shopify-cli.sh assert-version
      - name: theme check (JSON → annotation, dòng/cột từ 1)
        run: |
          rc=0
          shopify theme check --output json --fail-level error > "$RUNNER_TEMP/check.json" || rc=$?
          scripts/shopify-cli.sh check-report "$RUNNER_TEMP/check.json" || rc=1
          exit $rc
  preview:
    needs: theme-check
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.push.outputs.url }}
      theme_id: ${{ steps.push.outputs.theme_id }}
    env:
      SHOPIFY_FLAG_STORE: hoa-qua-nhap-khau.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g "@shopify/cli@$(scripts/shopify-cli.sh pinned)" && scripts/shopify-cli.sh assert-version
      # Dùng lại theme ai-<nhánh>; list {themes:[...]}/mảng, id chuỗi/số/gid; push partial + issues[] = lỗi (ES1-T32)
      - id: push
        run: scripts/preview-push.sh
  # Thử CLI 5.x: không chặn merge (continue-on-error). Chạy sau lighthouse/e2e để không đẩy đè theme khi đang đo.
  # Xanh ổn định nhiều PR liên tiếp → mở ticket nâng PINNED_CLI. Không đặt job này làm required check.
  cli5-canary:
    needs: [preview, lighthouse, e2e]
    if: always() && needs.preview.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SHOPIFY_FLAG_STORE: hoa-qua-nhap-khau.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @shopify/cli@5 && shopify version
      - name: theme check (CLI 5)
        run: |
          rc=0
          shopify theme check --output json --fail-level error > "$RUNNER_TEMP/check.json" || rc=$?
          scripts/shopify-cli.sh check-report "$RUNNER_TEMP/check.json" || rc=1
          exit $rc
      - name: preview (CLI 5, cùng theme ai-<nhánh>)
        id: push
        run: scripts/preview-push.sh
      - name: So theme id với job preview 4.9.5
        env:
          WANT: ${{ needs.preview.outputs.theme_id }}
          GOT: ${{ steps.push.outputs.theme_id }}
        run: |
          [ "$WANT" = "$GOT" ] || { echo "::error::CLI 5 đọc theme id $GOT, 4.9.5 là $WANT"; exit 1; }
          echo "CLI 5 preview OK: theme_id=$GOT"
  lighthouse:
    needs: preview
    runs-on: ubuntu-latest
    env:
      STORE_ORIGIN: https://hoa-qua-nhap-khau.myshopify.com
      THEME_ID: ${{ needs.preview.outputs.theme_id }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      BENCH_PRODUCT: ${{ vars.BENCH_PRODUCT }}
      BENCH_COLLECTION: ${{ vars.BENCH_COLLECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Lighthouse desktop + mobile
        run: |
          Q="preview_theme_id=${THEME_ID}&pb=0"
          URLS=(--collect.url="${STORE_ORIGIN}/?${Q}")
          [ -n "$BENCH_PRODUCT" ] && URLS+=(--collect.url="${STORE_ORIGIN}/products/${BENCH_PRODUCT}?${Q}")
          [ -n "$BENCH_COLLECTION" ] && URLS+=(--collect.url="${STORE_ORIGIN}/collections/${BENCH_COLLECTION}?${Q}")
          FAIL=0
          npx lhci autorun --config=lighthouserc.json "${URLS[@]}" || FAIL=1
          mkdir -p lh-out && cp .lighthouseci/lhr-*.json lh-out/ 2>/dev/null || true
          npx lhci autorun --config=lighthouserc.mobile.json "${URLS[@]}" || FAIL=1
          cp .lighthouseci/lhr-*.json lh-out/ 2>/dev/null || true
          exit $FAIL
      - name: Bảng điểm
        if: always()
        run: |
          # Đọc thẳng lhr-*.json: có cả khi assert fail (manifest chỉ có sau upload)
          shopt -s nullglob
          for f in lh-out/lhr-*.json; do
            jq -r '"\(.configSettings.formFactor)  \(.finalDisplayedUrl | split("?")[0])  status=\(.runtimeError.code // "ok")  perf=\(.categories.performance.score)  a11y=\(.categories.accessibility.score)  bp=\(.categories["best-practices"].score)  seo=\(.categories.seo.score)"' "$f"
          done
          # Audit accessibility chưa đạt (lấy từ lần đo đầu) — để biết sửa gì cho a11y >= 0.98
          F=$(ls lh-out/lhr-*.json 2>/dev/null | head -1)
          [ -n "$F" ] && jq -r '.categories.accessibility.auditRefs[] | select(.weight > 0) | .id' "$F" | while read id; do
            jq -r --arg id "$id" '.audits[$id] | select(.score != null and .score < 1) | "A11Y FAIL  \($id): \(.title)  — " + ([.details.items[]?.node.selector] | map(select(.)) | .[0:3] | join(" | "))' "$F"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: lh-out, if-no-files-found: ignore }
  # e2e tách desktop / mobile ra 2 runner (2 IP): chạy chung 1 runner thì nửa sau bị store dev trả 429/403 (CI #67, 04/11)
  e2e-run:
    needs: preview
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 2 shard mỗi project (CTO 05/11): mỗi runner ~1/2 số test → ít request mỗi IP, store dev bớt trả 403/429
      matrix:
        project: [desktop, mobile]
        shard: [1, 2]
    name: e2e-${{ matrix.project }}-${{ matrix.shard }}
    env:
      STORE_ORIGIN: https://hoa-qua-nhap-khau.myshopify.com
      PREVIEW_URL: https://hoa-qua-nhap-khau.myshopify.com/?preview_theme_id=${{ needs.preview.outputs.theme_id }}&pb=0
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      # Handle dữ liệu store cho spec TE-4 (ES1-T71); thiếu var thì spec dùng tests/e2e/store-data.json
      TE4_MEDIA_HANDLE: ${{ vars.TE4_MEDIA_HANDLE }}
      TE4_VARIANTS_HANDLE: ${{ vars.TE4_VARIANTS_HANDLE }}
      TE4_OPTIONS_HANDLE: ${{ vars.TE4_OPTIONS_HANDLE }}
      TE4_NO_MEDIA_HANDLE: ${{ vars.TE4_NO_MEDIA_HANDLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: playwright-report
          if-no-files-found: ignore
  # Check bắt buộc tên "e2e" (merge_pr.sh, dashboard): xanh khi cả 4 runner desktop/mobile × shard xanh
  e2e:
    needs: e2e-run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.e2e-run.result }}" = "success" ] || { echo "::error::e2e desktop/mobile: ${{ needs.e2e-run.result }}"; exit 1; }'
